name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openhaystack-nrf52-zephyr
      - name: Install west + nrfutil
        run: |
          pip install west
          curl -sSLo nrfutil https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil && sudo mv nrfutil /usr/local/bin/
          nrfutil self-upgrade
          nrfutil install toolchain-manager
      - name: West update (pinned sdk-nrf, see west.yml)
        run: |
          cd openhaystack-nrf52-zephyr
          west init -l . .
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Build nice_nano_v2
        run: |
          cd openhaystack-nrf52-zephyr
          west build -p always -b nice_nano_v2 app
