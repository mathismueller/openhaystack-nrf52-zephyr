name: build

on:
  push:
    paths-ignore: ['**.md', 'LICENSE', 'firmware/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'firmware/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests (key encoding, no SDK needed)
        run: make -C tests/host clean test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps + ARM toolchain
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-pip \
            xz-utils file make gcc gcc-arm-none-eabi
          arm-none-eabi-gcc --version
      - name: Install uv + west
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: NCS workspace (pinned sdk-nrf, see west.yml)
        run: |
          export PATH="$HOME/.local/bin:$PATH"  # GITHUB_PATH lands next step
          uv tool install west
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.4.1 ws
          cd ws
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Build via build_tag.sh (single source of truth)
        run: |
          uv venv --python 3.12 "$GITHUB_WORKSPACE/ws/.venv"
          uv pip install --python "$GITHUB_WORKSPACE/ws/.venv/bin/python" \
            west -r "$GITHUB_WORKSPACE/ws/zephyr/scripts/requirements.txt" \
            -r "$GITHUB_WORKSPACE/ws/nrf/scripts/requirements.txt" \
            -r "$GITHUB_WORKSPACE/ws/bootloader/mcuboot/scripts/requirements.txt"
          NCS_WS="$GITHUB_WORKSPACE/ws" ./build_tag.sh
      - name: Upload freshly built UF2
        uses: actions/upload-artifact@v4
        with:
          name: haystack-tag-uf2
          path: firmware/haystack-tag-promicro_nrf52840_nrf52840_uf2.uf2
