# nice!nano v2 / Tenstar clone: proven from 4-Bench-Sniffer-nRF52840.
# Clones may lack the 32.768 kHz crystal -> internal RC + calibration,
# so the FW boots with or without XTAL fitted. UF2 for drag-drop flash.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BUILD_OUTPUT_UF2=y
# nRF52840 DCDC is already on via board-root BOARD_ENABLE_DCDC (default y).
# LDO ~10mA adv peaks -> ~5mA. Do not force SOC_DCDC_NRF52X here (no prompt).
# Adv TX power stays at the Kconfig default (0 dBm). +8 dBm roughly doubles
# radio energy for little city-range gain; drop to MINUS_4/MINUS_8 only if
# you accept shorter finder pickup distance.
