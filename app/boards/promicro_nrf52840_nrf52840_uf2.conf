# Upstream promicro_nrf52840/nrf52840/uf2 (NCS >= v3.x, Zephyr 4.x).
# Clones may lack the 32.768 kHz crystal -> internal RC + calibration,
# so the FW boots with or without XTAL fitted. UF2 for drag-drop flash.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BUILD_OUTPUT_UF2=y
# USB CDC ACM needs the serial core (console stays off in release).
CONFIG_SERIAL=y
# USB stack is initialized at boot (board default) but NOT enabled: main()
# enables it only while VBUS is present, so there is no battery cost.
# Debug overlay re-enables auto-enable (shell/logs need USB from boot).
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
