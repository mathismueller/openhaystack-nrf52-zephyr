# Debug overlay: enable USB CDC ACM UART logs on boards with USB (e.g. nice!nano).
# The promicro_nrf52840 board already provides a cdc_acm_uart console on the
# NEW USB device stack (device_next) — do NOT enable the legacy
# CONFIG_USB_DEVICE_STACK here, it conflicts (duplicate cdc_acm symbols).
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Shell on the same CDC UART (serial backend auto-selected from the board's
# shell-uart chosen node): provides the `uf2` command to reboot into the
# UF2 bootloader without double-pressing RST.
CONFIG_SHELL=y
# Kernel reboot API used by the `uf2` command / 1200-baud touch.
CONFIG_REBOOT=y
# Debug needs USB from boot (shell/logs); prj.conf gates it on VBUS for
# release, so re-enable auto-enable here (later EXTRA_CONF_FILE wins).
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
