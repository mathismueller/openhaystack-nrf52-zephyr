# Release (max battery): overlay with -DOVERLAY_CONF=release.conf
# Cuts RTT/log shell that prj.conf keeps for debug. USB/UART already off.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_SHELL=n
# System workqueue idle; advertiser runs in controller, app thread parked.
CONFIG_PM_DEVICE_RUNTIME=y
