# Bluetooth (SoftDevice Controller is the NCS default on nRF)
CONFIG_BT=y
CONFIG_BT_ID_MAX=2
CONFIG_BT_DEVICE_NAME="BikeTag"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_EXT_ADV=n

# OpenHaystack module
CONFIG_OPENHAYSTACK=y

# Logging: LOG over RTT by default, USB-CDC enabled via debug-usb-uart.conf overlay
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Power: tickless idle + device PM, no serial by default (enabled in debug overlay)
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_SERIAL=n
