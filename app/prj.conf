# Bluetooth (SoftDevice Controller, NCS default on nRF)
CONFIG_BT=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_MPSL=y
CONFIG_BT_ID_MAX=2
CONFIG_BT_DEVICE_NAME="HaystackTag"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_EXT_ADV=n

# OpenHaystack module
CONFIG_OPENHAYSTACK=y

# Logging: off by default (UF2-only board, no RTT/SWD attached).
# Enable via debug-usb-uart.conf overlay when USB CDC logs are wanted.
CONFIG_LOG=n

# Power: tickless idle + device PM, no console by default (debug overlay).
# SERIAL stays off here; the NCS-v3 board conf enables the serial core for
# the USB CDC ACM stack (old NCS-v2 tree has no new-stack symbols, so
# anything USB-stack-specific lives in the board conf, not here).
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# sys_reboot() for the UF2 software entry (GPREGRET=0x57 + reset).
CONFIG_REBOOT=y
